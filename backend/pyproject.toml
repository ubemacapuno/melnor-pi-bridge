[project]
name = "melnor-test"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.11.3",
    "fastapi>=0.139.2",
    "melnor-bluetooth>=0.0.25",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# Put backend/ on the import path so tests can `from api import store` when you
# run `uv run pytest` from the backend/ directory.
pythonpath = ["."]
testpaths = ["tests"]
